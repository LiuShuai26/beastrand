[project]
name = "beastrand"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "gymnasium>=1.0",
    "pyzmq>=25.0",
    "tyro>=0.5",
    "tensorboard>=2.14",
    "onnxscript>=0.1",
]

[project.optional-dependencies]
tennis = [
    "pettingzoo[atari]>=1.24",
    "supersuit>=3.9",
    "autorom[accept-rom-license]>=0.6",
]
# Pong needs the same atari stack as tennis (pettingzoo[atari] pulls in ale-py
# transitively for both the pong_v3 self-play env and the single-agent
# PongNoFrameskip-v4 bot env used by DualEnvWrapper).
pong = [
    "pettingzoo[atari]>=1.24",
    "supersuit>=3.9",
    "ale-py>=0.10",
    "autorom[accept-rom-license]>=0.6",
]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["beastrand*", "projects*"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
